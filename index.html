<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitLab Launcher</title>
<script>/* apply the saved theme and style before the page is drawn (no flash) */
try { const t = localStorage.getItem("theme"), s = localStorage.getItem("style");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  if (s === "terminal" || s === "turbo") document.documentElement.dataset.style = s; } catch (e) {}
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f5f6f8;--card:#fff;--fg:#1c2230;--mut:#6b7280;--bd:#e4e7eb;--hover:#f0f2f5;
  --acc:#4f46e5;--acc-fg:#fff;--ok:#15803d;--err:#b91c1c;--run:#b45309;--chip:#eef0f4;
}
/* Theme: auto (follows the system) unless the header switch sets data-theme="light" or "dark" */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--mut:#9aa1ad;--bd:#272c36;--hover:#1e222b;
  --acc:#818cf8;--acc-fg:#0f1115;--ok:#4ade80;--err:#f87171;--run:#fbbf24;--chip:#232833;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--mut:#9aa1ad;--bd:#272c36;--hover:#1e222b;
  --acc:#818cf8;--acc-fg:#0f1115;--ok:#4ade80;--err:#f87171;--run:#fbbf24;--chip:#232833;
}
/* Style "terminal" (header selector): monospace, square, prompt look; light = paper terminal, dark = phosphor */
:root[data-style="terminal"]{
  color-scheme:light;
  --bg:#fdf6e3;--card:#fffbef;--fg:#073642;--mut:#5f7379;--bd:#ddd3b8;--hover:#f3ecd6;
  --acc:#0f6e64;--acc-fg:#fdf6e3;--ok:#4f7a00;--err:#c2261d;--run:#a0590f;--chip:#eee6cc;
}
@media (prefers-color-scheme:dark){:root[data-style="terminal"]:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0b0e0b;--card:#101510;--fg:#d2f2d2;--mut:#7f9c7f;--bd:#243124;--hover:#172117;
  --acc:#39d353;--acc-fg:#0b0e0b;--ok:#39d353;--err:#ff6b6b;--run:#e3b341;--chip:#1a251a;
}}
:root[data-style="terminal"][data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e0b;--card:#101510;--fg:#d2f2d2;--mut:#7f9c7f;--bd:#243124;--hover:#172117;
  --acc:#39d353;--acc-fg:#0b0e0b;--ok:#39d353;--err:#ff6b6b;--run:#e3b341;--chip:#1a251a;
}
/* Style "turbo" (Turbo C++ DOS IDE look, 16-colour CGA palette): dark = classic blue editor, light = grey dialog */
:root[data-style="turbo"]{
  color-scheme:light;
  --bg:#aaaaaa;--card:#c0c0c0;--fg:#000000;--mut:#333333;--bd:#000000;--hover:#b4b4b4;
  --acc:#0000aa;--acc-fg:#ffffff;--ok:#006600;--err:#aa0000;--run:#884400;--chip:#d6d6d6;
}
@media (prefers-color-scheme:dark){:root[data-style="turbo"]:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0000aa;--card:#0000aa;--fg:#ffffff;--mut:#aaaaaa;--bd:#ffffff;--hover:#000080;
  --acc:#ffff55;--acc-fg:#000000;--ok:#55ff55;--err:#ff5555;--run:#ffaa55;--chip:#000080;
}}
:root[data-style="turbo"][data-theme="dark"]{
  color-scheme:dark;
  --bg:#0000aa;--card:#0000aa;--fg:#ffffff;--mut:#aaaaaa;--bd:#ffffff;--hover:#000080;
  --acc:#ffff55;--acc-fg:#000000;--ok:#55ff55;--err:#ff5555;--run:#ffaa55;--chip:#000080;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:var(--acc);text-decoration:none}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.bar{max-width:1080px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:24px}
.brand{font-weight:700;font-size:15px;color:var(--fg)}
nav{display:flex;gap:4px;flex:1}
nav a{color:var(--mut);padding:6px 12px;border-radius:6px;font-weight:500}
nav a.on,nav a:hover{color:var(--fg);background:var(--hover)}
.pill{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--chip);color:var(--mut);white-space:nowrap}
.pill.bad{color:var(--err)}
.theme-btn{border:1px solid var(--bd);cursor:pointer;font:inherit;font-size:12px;color:var(--fg)}
.theme-btn:hover{background:var(--hover)}
select.style-sel{width:auto;padding:3px 8px;border-radius:12px;background:var(--chip)}
.hdr-tools{display:flex;gap:8px;align-items:center}
/* terminal style */
[data-style="terminal"] body,[data-style="terminal"] input,[data-style="terminal"] select,[data-style="terminal"] button,
[data-style="terminal"] textarea,[data-style="terminal"] #toast{font-family:"SF Mono",ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
[data-style="terminal"] body{font-size:13px;line-height:1.55}
[data-style="terminal"] *,[data-style="terminal"] *::before,[data-style="terminal"] *::after{border-radius:0!important}
[data-style="terminal"] ::selection{background:var(--acc);color:var(--acc-fg)}
[data-style="terminal"] input,[data-style="terminal"] select{caret-color:var(--acc)}
[data-style="terminal"] .brand::before{content:"$ ~/";color:var(--acc)}
[data-style="terminal"] .brand::after{content:"▌";color:var(--acc);margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){[data-style="terminal"] .brand::after{animation:none}}
[data-style="terminal"] .brand{text-transform:lowercase;letter-spacing:0}
[data-style="terminal"] nav a{font-weight:400}
[data-style="terminal"] nav a::before{content:"./";color:var(--mut)}
[data-style="terminal"] nav a.on{background:transparent;color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
[data-style="terminal"] h1::before{content:"# ";color:var(--acc)}
[data-style="terminal"] .card>h2::before,[data-style="terminal"] .sec-title::before{content:"## ";color:var(--acc)}
[data-style="terminal"] .btn{background:transparent;color:var(--acc);border:1px solid var(--acc);font-weight:500}
[data-style="terminal"] .btn:hover:not(:disabled){background:var(--acc);color:var(--acc-fg)}
[data-style="terminal"] .btn.sec{color:var(--fg);border-color:var(--bd)}
[data-style="terminal"] .btn.sec:hover:not(:disabled){background:var(--hover);color:var(--fg);border-color:var(--fg)}
[data-style="terminal"] .btn.danger{color:var(--err);border-color:var(--err)}
[data-style="terminal"] .btn.danger:hover:not(:disabled){background:var(--err);color:var(--bg)}
[data-style="terminal"] .card,[data-style="terminal"] .pcard{box-shadow:none}
[data-style="terminal"] .pcard:hover{border-color:var(--acc)}
[data-style="terminal"] th{text-transform:lowercase}
[data-style="terminal"] #toast{border-left-width:4px}
/* turbo style */
[data-style="turbo"] body,[data-style="turbo"] input,[data-style="turbo"] select,[data-style="turbo"] button,
[data-style="turbo"] textarea,[data-style="turbo"] #toast{font-family:"SF Mono",ui-monospace,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
[data-style="turbo"] body{font-size:13px;line-height:1.55;scrollbar-color:#00aaaa #000080}
[data-style="turbo"] *,[data-style="turbo"] *::before,[data-style="turbo"] *::after{border-radius:0!important}
[data-style="turbo"] ::selection{background:#00aaaa;color:#000}
[data-style="turbo"] header{background:#aaaaaa;border-bottom:0}
[data-style="turbo"] .bar{height:34px}
[data-style="turbo"] .brand{color:#000;font-weight:400}
[data-style="turbo"] .brand::before{content:"≡ ";color:#000}
[data-style="turbo"] nav a{color:#000;font-weight:400;padding:2px 10px}
[data-style="turbo"] nav a::first-letter{color:#aa0000}
[data-style="turbo"] nav a.on,[data-style="turbo"] nav a:hover{background:#00aa00;color:#000}
[data-style="turbo"] header .pill{background:#aaaaaa;color:#000;border:0}
[data-style="turbo"] header .pill.bad{color:#aa0000}
[data-style="turbo"] header select.style-sel{background:#00aaaa}
[data-style="turbo"] .card,[data-style="turbo"] .pcard{border:3px double var(--bd);box-shadow:none}
[data-style="turbo"] .card>h2,[data-style="turbo"] .sec-title{display:table;margin:-30px auto 12px;padding:0 8px;background:var(--card);
  color:var(--fg);font-size:13px;font-weight:600;line-height:20px}
[data-style="turbo"] .card>h2::before,[data-style="turbo"] .sec-title::before{content:"[■] ";color:var(--ok)}
[data-style="turbo"] h1{color:var(--acc)}
[data-style="turbo"] .pcard:hover{border-color:var(--acc)}
[data-style="turbo"] .btn{background:#00aa00;color:#000;border:0;box-shadow:3px 3px 0 #000;font-weight:400}
[data-style="turbo"] .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
[data-style="turbo"] .btn.sec{background:#aaaaaa;color:#000}
[data-style="turbo"] .btn.danger{background:#aa0000;color:#fff;border:0}
[data-style="turbo"] input,[data-style="turbo"] select{background:#00aaaa;color:#000;border:0;caret-color:#000}
[data-style="turbo"] input::placeholder{color:#004c4c}
[data-style="turbo"] th{color:var(--acc);font-weight:400}
[data-style="turbo"] .chip{color:var(--fg)}
[data-style="turbo"] #toast{border:3px double #fff;box-shadow:4px 4px 0 #000}
main{max-width:1080px;margin:0 auto;padding:28px 16px 60px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.stack>*+*{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}.bar{gap:12px}.brand{display:none}}
.pcard{display:block;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;transition:border-color .15s}
.pcard:hover{border-color:var(--acc)}
.pcard .name{font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--mut)}
.chip.ref{font-family:ui-monospace,Menlo,monospace;color:var(--fg)}
.last{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:var(--acc-fg);border:0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:0}
.wrap{overflow-x:auto}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
dt{color:var(--mut)}dd{margin:0;word-break:break-word}
.st{font-weight:600;font-size:12px}
.s-success{color:var(--ok)}.s-failed,.s-canceled{color:var(--err)}
.s-running,.s-pending,.s-created,.s-preparing,.s-waiting_for_resource{color:var(--run)}.s-manual,.s-scheduled{color:var(--acc)}
.runs a{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--bd);color:inherit;font-size:13px}
.runs a:hover,.runs a.on{background:var(--hover)}
.runs a:last-child{border-bottom:0}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
form .sec-title{font-weight:600;margin:4px 0 10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.check input{width:auto}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.danger-zone{border-color:var(--err)}
#toast{position:fixed;top:64px;right:16px;max-width:min(440px,calc(100vw - 32px));display:flex;gap:10px;align-items:flex-start;
  background:#15803d;color:#fff;padding:14px 14px 14px 16px;border-radius:10px;border-left:6px solid rgba(255,255,255,.6);
  font-size:14px;font-weight:600;line-height:1.4;box-shadow:0 12px 32px rgba(0,0,0,.4);
  opacity:0;transform:translateX(28px);transition:opacity .25s,transform .25s;pointer-events:none;cursor:pointer;z-index:50}
#toast.show{opacity:1;transform:none;pointer-events:auto}#toast.err{background:#b91c1c}
#toast .ico{font-size:16px}#toast .tmsg{flex:1;word-break:break-word}#toast .x{opacity:.75;font-weight:400;padding-left:6px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.full{margin-top:16px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--chip);color:var(--fg)}
.sev-2{color:var(--err)}.sev-1{color:var(--run)}.sev0{color:var(--ok)}.sev--1,.sev--2{color:var(--mut)}
.badge.sev-2{background:color-mix(in srgb,var(--err) 14%,transparent)}.badge.sev-1{background:color-mix(in srgb,var(--run) 14%,transparent)}
.badge.sev0{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.kpi .v{font-size:18px;font-weight:700;margin-top:2px}
details{border-top:1px solid var(--bd);padding-top:10px;margin-top:14px}
summary{cursor:pointer;font-weight:600;font-size:14px;margin-bottom:8px}
details.t3env{margin-top:18px}
details.t3env>summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0;font-size:16px;list-style:none}
details.t3env>summary::-webkit-details-marker{display:none}
details.t3env>summary::before{content:"▸";color:var(--mut);width:12px}
details.t3env[open]>summary::before{content:"▾"}
details.t3env[open]>summary{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)}
tr.upd>td{background:color-mix(in srgb,var(--acc) 8%,transparent)}
tr.upd.major>td{background:color-mix(in srgb,var(--run) 12%,transparent)}
.upd-v{color:var(--acc);font-weight:600}tr.major .upd-v{color:var(--run)}
.chip.major{background:color-mix(in srgb,var(--run) 22%,transparent);color:var(--run);font-weight:600}
tr[data-ext]{cursor:pointer}tr[data-ext]:hover>td{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--fg) 5%,transparent)}
tr[data-ext] .tw{display:inline-block;width:12px;color:var(--mut)}
tr.cl-row>td{padding:0 0 12px}
.cl-box{border-left:3px solid var(--acc);background:var(--bg);border-radius:6px;padding:12px 16px;font-size:13px;line-height:1.55}
.cl-box.major{border-left-color:var(--run)}
.cl-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:8px}
.cl-body{max-height:440px;overflow:auto;border-top:1px solid var(--bd);padding-top:8px}
.cl-body .md-h{font-weight:700;margin:12px 0 4px}.cl-body .md-h:first-child{margin-top:0}
.cl-body ul,.cl-body ol{margin:4px 0;padding-left:20px}.cl-body p{margin:6px 0}
.cl-body pre{white-space:pre-wrap;background:var(--chip);padding:8px;border-radius:6px;font-size:12px}
table.checks td:nth-child(3){width:55%}table.checks td:nth-child(4){max-width:320px;word-break:break-word}
table.checks td:nth-child(1),table.checks td:nth-child(2){white-space:nowrap}
.t3meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;font-weight:400}
.msg{color:var(--mut);font-size:12px;margin-top:2px}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:8px 0 8px 14px;border-left:2px solid var(--bd);margin-left:4px}
.tl .when{font-size:12px;color:var(--mut)}
.tl ul{margin:4px 0 0;padding-left:18px;font-size:13px}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/">GitLab Launcher</a>
  <nav>
    <a href="#/" data-nav="projects">Projects</a>
    <a href="#/activity" data-nav="activity">Activity</a>
    <a href="#/scheduler" data-nav="scheduler">Scheduler</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="hdr-tools">
    <select class="pill style-sel" id="styleSel" title="Style" aria-label="Style">
      <option value="default">Default</option><option value="terminal">Terminal</option><option value="turbo">Turbo C++</option></select>
    <button type="button" class="pill theme-btn" id="themeBtn">◐ Auto</button>
  </div>
  <span class="pill" id="tokenPill">…</span>
</div></header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite" title="Click to close"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ACTIVE = ["created","waiting_for_resource","preparing","pending","running","manual","scheduled"];
let S = null, pollT = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
// Flash message top right: success 6 s, error 12 s; click closes it
const closeAfter = ev => ev.submitter?.dataset.close ? (location.hash = "#/", true) : false;  // "Save & close" -> Projects
function toast(msg, err) {
  const t = $("#toast");
  t.innerHTML = `<span class="ico">${err ? "⚠" : "✓"}</span><span class="tmsg">${esc(msg)}</span><span class="x">✕</span>`;
  t.className = "show" + (err ? " err" : ""); t.onclick = () => t.className = t.className.replace("show", "").trim();
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", err ? 12000 : 6000);
}
const varsStr = o => Object.entries(o || {}).map(([k, v]) => `${k}=${v}`).join(", ");
const parseVars = s => Object.fromEntries((s || "").split(",").map(x => x.trim()).filter(x => x.includes("="))
  .map(x => { const i = x.indexOf("="); return [x.slice(0, i).trim(), x.slice(i + 1).trim()]; }).filter(([k]) => k));
const proj = id => S.projects.find(p => p.id === id);
const pUrl = p => `#/p/${encodeURIComponent(p.id)}`;
const glUrl = p => `${p.gitlab_url}/${p.path}/-/pipelines`;
const fmt = t => t ? t.replace("T", " ") : "–";

// Theme switch in the header: Auto (system) → Light → Dark; saved per browser
const THEMES = [{id:"auto", label:"◐ Auto", hint:"follows the system setting"},
  {id:"light", label:"☀ Light", hint:"always light"}, {id:"dark", label:"☾ Dark", hint:"always dark"}];
function setTheme(id, save) {
  const root = document.documentElement, t = THEMES.find(x => x.id === id) || THEMES[0];
  if (t.id === "auto") delete root.dataset.theme; else root.dataset.theme = t.id;
  if (save) try { t.id === "auto" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t.id); } catch (e) {}
  const b = $("#themeBtn"), next = THEMES[(THEMES.indexOf(t) + 1) % THEMES.length];
  b.textContent = t.label; b.title = `Theme: ${t.id} (${t.hint}). Click for ${next.id}.`;
  b.setAttribute("aria-label", b.title);
}
setTheme(document.documentElement.dataset.theme || "auto");
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.dataset.theme || "auto";
  setTheme(THEMES[(THEMES.findIndex(x => x.id === cur) + 1) % THEMES.length].id, true);
};

// Style selector next to the theme switch: Default, Terminal or Turbo C++; saved per browser
const STYLES = ["default", "terminal", "turbo"];
function setStyle(id, save) {
  const root = document.documentElement, st = STYLES.includes(id) ? id : "default";
  if (st === "default") delete root.dataset.style; else root.dataset.style = st;
  if (save) try { st === "default" ? localStorage.removeItem("style") : localStorage.setItem("style", st); } catch (e) {}
  $("#styleSel").value = root.dataset.style || "default";
}
setStyle(document.documentElement.dataset.style || "default");
$("#styleSel").onchange = ev => setStyle(ev.target.value, true);

async function refresh() {
  S = await api("/api/state");
  const pill = $("#tokenPill");
  pill.textContent = S.token_source ? "Token ✓" : "No token";

const SEV = {"-2":"notice", "-1":"info", "0":"ok", "1":"warning", "2":"error"};
const sevBadge = n => `<span class="badge ${Number(n) === 0 ? "sev0" : "sev-" + Number(n)}">${esc(SEV[n] || n)}</span>`;  // CSS: sev-2 error, sev-1 warning, sev0 ok, sev--1/--2 info
const verCmp = (a, b) => { const x = String(a).split("."), y = String(b).split(".");
  for (let i = 0; i < 3; i++) { const d = (parseInt(x[i]) || 0) - (parseInt(y[i]) || 0); if (d) return d; } return 0; };

  const row = x => `<tr><td>${sevBadge(x.severity)}</td><td>${esc(x.group)}</td><td><b>${esc(x.title)}</b>

  set(`<b>${esc(c.typo3 || "?")}</b>${upd ? `<span class="sev-1">↑ ${esc(latest)}</span>` : ""}
      <span class="badge ${counts[2] ? "sev-2" : "sev0"}">${counts[2] || 0} error${counts[2] === 1 ? "" : "s"}</span>

      <div class="wrap"><table>

        ${!e.local && e.composer ? `data-ext="${esc(k)}" data-composer="${esc(e.composer)}" data-version="${esc(e.update ? e.latest : e.version)}"

        <td>${!e.local && e.composer ? `<span class="tw">▸</span>` : ""}<code>${esc(k)}</code>${e.local ? ` <span class="chip">local</span>` : ""}</td>
        <td>${esc(e.title)}</td><td>${esc(e.version)}</td><td>${latestCell(e)}</td><td>${esc(e.composer)}</td></tr>`).join("")}
      </tbody></table></div></details>
    <details><summary>Problems (${problems.length ? `${counts[2] || 0} error${counts[2] === 1 ? "" : "s"}, ${counts[1] || 0} warning${counts[1] === 1 ? "" : "s"}` : "none"})</summary>
      ${problems.length ? `<div class="wrap"><table class="checks"><thead><tr><th>Severity</th><th>Area</th><th>Check</th><th>Value</th></tr></thead>

// Minimal Markdown -> HTML (everything escaped; only http(s) links, relative ones resolved against the file)
function mdRender(md, base) {
  const txt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const link = (t, u) => { let h; try { h = new URL(u, base || undefined).href; } catch { return txt(t); }
    return /^https?:/.test(h) ? `<a href="${esc(h)}" target="_blank" rel="noopener">${txt(t)}</a>` : txt(t); };
  const inline = raw => { let out = "", last = 0, m; const re = /\[([^\]]+)\]\(([^)\s]+)\)/g;
    while ((m = re.exec(raw))) { out += txt(raw.slice(last, m.index)) + link(m[1], m[2]); last = re.lastIndex; }
    return out + txt(raw.slice(last)); };
  let html = "", list = null, code = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const ln of md.replace(/\r/g, "").split("\n")) {
    if (/^\s*```/.test(ln)) { if (code === null) { close(); code = []; } else { html += `<pre>${esc(code.join("\n"))}</pre>`; code = null; } continue; }
    if (code !== null) { code.push(ln); continue; }
    let m;
    if ((m = ln.match(/^#{1,6}\s+(.*)/))) { close(); html += `<div class="md-h">${inline(m[1].replace(/#+\s*$/, ""))}</div>`; }
    else if ((m = ln.match(/^\s*([-*+]|\d+[.)])\s+(.*)/))) { const t = /\d/.test(m[1]) ? "ol" : "ul";
      if (list !== t) { close(); html += `<${t}>`; list = t; } html += `<li>${inline(m[2])}</li>`; }
    else if (!ln.trim()) close();
    else { close(); html += `<p>${inline(ln)}</p>`; }
  }
  if (code !== null) html += `<pre>${esc(code.join("\n"))}</pre>`;
  close(); return html;
}

// Extension row click: show/hide the changelog of the latest version (update) or of the installed version
async function toggleChangelog(tr) {
  const open = tr.nextElementSibling?.classList.contains("cl-row");
  tr.querySelector(".tw").textContent = open ? "▸" : "▾";
  if (open) return tr.nextElementSibling.remove();
  const x = tr.dataset, row = document.createElement("tr");
  row.className = "cl-row";
  const upd = x.version !== x.installed;
  row.innerHTML = `<td colspan="5"><div class="cl-box ${x.major ? "major" : ""}"><p class="empty">Loading changelog…</p></div></td>`;
  tr.after(row);
  const box = row.querySelector(".cl-box");
  try {
    const d = await api(`/api/ext/changelog?composer=${encodeURIComponent(x.composer)}&version=${encodeURIComponent(x.version)}&installed=${encodeURIComponent(x.installed)}`);
    const links = [d.url && `<a href="${esc(d.url)}" target="_blank" rel="noopener">Open source ↗</a>`,
      d.compare && `<a href="${esc(d.compare)}" target="_blank" rel="noopener">Full list of changes ${esc(x.installed)} → ${esc(d.version)} ↗</a>`,
      d.repo && `<a href="${esc(d.repo)}" target="_blank" rel="noopener">Repository ↗</a>`].filter(Boolean).join(" · ");
    box.innerHTML = `<div class="cl-head"><b>Changelog ${esc(x.ext)} ${esc(d.version)}</b>
        ${upd ? `<span class="${x.major ? "chip major" : "upd-v"}">${x.major ? "major update" : "update"} from ${esc(x.installed)}</span>` : `<span class="sub">installed version</span>`}
        ${d.found_in ? `<span class="sub">from ${esc(d.found_in)}</span>` : ""}<span class="sub">${links}</span></div>
      ${d.text ? `<div class="cl-body">${mdRender(d.text, d.base)}</div>`
        : `<p class="empty">No changelog found for ${esc(d.version)} (no release notes, no CHANGELOG.md entry). Use the links above.</p>`}`;
  } catch (e) { box.innerHTML = `<p class="empty">Changelog not available: ${esc(e.message)}</p>`; }
}

    $("#pipe").innerHTML = `<div class="wrap"><table><thead><tr><th>Stage</th><th>Job</th><th>Status</th><th></th></tr></thead><tbody>
      ${d.jobs.slice().reverse().map(j => `<tr><td>${esc(j.stage)}</td><td>${esc(j.name)}</td>
        <td><span class="st s-${esc(j.status)}">${esc(j.status)}</span></td>

      </tbody></table></div>
      ${p.production?.ref && d.pipeline.ref === p.ref && d.pipeline.status === "success"
        ? `<div class="actions" style="margin-top:12px"><button class="btn" data-act="promote" data-from="${Number(pid)}">🚀 Promote to production (${esc(p.production.ref)})</button></div>` : ""}`;

}

// Branch select options: staging/production + GitLab branches + current value
function branchOpts(list, cur, allowNone) {
  const names = [...new Set(["staging", "production", ...list, ...(cur ? [cur] : [])])];
  return (allowNone ? `<option value="" ${cur ? "" : "selected"}>– none (no promote) –</option>` : "")
    + names.map(b => `<option value="${esc(b)}" ${b === cur ? "selected" : ""}>${esc(b)}</option>`).join("");
}

   ph:"https://staging.example.com/", hint:"Staging instance with the t3monitor extension installed (own key)."}];
const t3mOn = (p, e) => !!(p[e.cfg]?.url && S[e.keys]?.includes(p.id));

function t3mFields(e, p) {

            .map(m => `<option value="${m}" ${m === Number(a.major) ? "selected" : ""}>${m}</option>`).join("")}</select></div>
          <div><label>Update variables</label><input name="auto_variables" value="${esc(varsStr(a.variables))}"></div>

        <a class="btn sec" href="${p ? pUrl(p) : "#/"}">Cancel</a></div>
    </form>`;
  const fm = $("#pform"), E = fm.elements, sp = E.auto_play, pp = E.prod_play;
  // Generate a 64-char t3monitor key locally (32 random bytes → hex). Fills + reveals the field for copying.
  // Non-destructive: nothing is stored until "Save changes"; the SAME value must be set as the site's encryption_key.
  fm.addEventListener("click", ev => {
    const b = ev.target.closest("[data-gen]"); if (!b) return;
    ev.preventDefault();
    const inp = E[b.dataset.gen];
    inp.value = [...crypto.getRandomValues(new Uint8Array(32))].map(x => x.toString(16).padStart(2, "0")).join("");
    inp.type = "text"; inp.focus(); inp.select();
    const h = fm.querySelector(`[data-genhint="${b.dataset.gen}"]`); if (h) h.style.display = "";
    toast("Key generated — copy it into the site’s t3monitor encryption_key, then Save changes");
  });
  // Copy the current key field value to the clipboard (clipboard API, with a legacy fallback for insecure contexts).
  fm.addEventListener("click", async ev => {
    const b = ev.target.closest("[data-copy]"); if (!b) return;
    ev.preventDefault();
    const inp = E[b.dataset.copy], val = (inp.value || "").trim();
    if (!val) { toast("Nothing to copy — generate or enter a key first", true); return; }
    const was = inp.type; inp.type = "text";
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(val);
      else { inp.focus(); inp.select(); document.execCommand("copy"); }
      toast("Key copied to clipboard");
    } catch (e) { inp.focus(); inp.select(); toast("Copy failed — select and copy manually (Cmd/Ctrl+C)", true); }
    if (was === "password") inp.type = "password";
  });
  // Pre-fill from GitLab: only fields the user has not typed in; when editing, only empty ones.
  const touched = new Set();
  fm.addEventListener("input", ev => touched.add(ev.target.name));
  const fill = (name, val) => {
    const el = E[name];
    if (val == null || val === "" || touched.has(name) || (p && el.value.trim())) return;
    if (el.tagName === "SELECT" && ![...el.options].some(o => o.value === String(val))) el.add(new Option(val, val));
    el.value = Array.isArray(val) ? val.join(", ") : val;
  };
  let searchT;
  E.path.addEventListener("input", () => {        // project search suggestions
    clearTimeout(searchT);
    const q = E.path.value.trim();
    if (q.length < 2) return;
    searchT = setTimeout(async () => {
      try {
        const r = await api(`/api/search?gitlab_url=${encodeURIComponent(E.gitlab_url.value.trim())}&q=${encodeURIComponent(q)}`);
        $("#projlist").innerHTML = r.map(x => `<option value="${esc(x.path)}">${esc(x.name)}</option>`).join("");
      } catch (e) { /* suggestions are optional */ }
    }, 300);
  });
  async function loadInfo() {
    const url = E.gitlab_url.value.trim(), path = E.path.value.trim();
    if (!url || !path.includes("/")) return;
    $("#pinfo").textContent = "Reading project from GitLab…";
    try {
      const d = await api(`/api/project-info?gitlab_url=${encodeURIComponent(url)}&path=${encodeURIComponent(path)}&ref=${encodeURIComponent(E.ref.value.trim())}`);
      E.ref.innerHTML = branchOpts(d.branches, E.ref.value);
      E.prod_ref.innerHTML = branchOpts(d.branches, E.prod_ref.value, true);
      fill("name", d.name); fill("ref", d.ref); fill("auto_play", d.auto_play);
      fill("prod_ref", d.prod_ref); fill("prod_play", d.prod_play); fill("major", d.major);
      synced = pp.value === sp.value;
      $("#pinfo").textContent = `Pre-filled from GitLab (default branch: ${d.default}${d.major ? `, TYPO3 ${d.major}` : ""})`;
    } catch (e) { $("#pinfo").textContent = `GitLab lookup failed: ${e.message}`; }
  }
  E.path.addEventListener("change", loadInfo);
  E.ref.addEventListener("change", loadInfo);
  E.gitlab_url.addEventListener("change", loadInfo);
  let synced = pp.value === sp.value;            // mirror staging jobs until prod field is edited by hand
  sp.addEventListener("input", () => { if (synced) pp.value = sp.value; });
  pp.addEventListener("input", () => { synced = pp.value === sp.value; });
  loadInfo();
  $("#pform").onsubmit = async ev => {
    ev.preventDefault();
    const f = new FormData(ev.target);
    const body = {name:f.get("name"), gitlab_url:f.get("gitlab_url"), path:f.get("path"), ref:f.get("ref"),
      variables:parseVars(f.get("variables")), auto_play:f.get("auto_play"),
      auto_enabled:f.get("auto_enabled") === "on", major:f.get("major"),
      auto_variables:parseVars(f.get("auto_variables")), auto_typo3_play:f.get("auto_typo3_play"),
      prod_ref:f.get("prod_ref"), prod_variables:parseVars(f.get("prod_variables")), prod_play:f.get("prod_play"),
      ...Object.fromEntries(T3M_ENVS.flatMap(e => [["url", f.get(e.f + "url")], ["key", f.get(e.f + "key")],
        ["key_clear", f.get(e.f + "key_clear") === "on"], ["auth_user", f.get(e.f + "auth_user")],
        ["auth_password", f.get(e.f + "auth_password")], ["auth_clear", f.get(e.f + "auth_clear") === "on"]]
        .map(([k, val]) => [e.f + k, val])))};
    try {
      const saved = p ? await api("/api/projects/update", {...body, id:p.id}) : await api("/api/projects", body);
      await refresh(); toast(p ? "Project saved" : "Project created"); location.hash = pUrl(saved);
    } catch (e) { toast(e.message, true); }
  };
}

  async runall(el) {
    const ps = S.projects;
    if (!confirm(`Start pipelines for all ${ps.length} project(s) at once?\n\n` + ps.map(p => `• ${p.name} (${p.ref})`).join("\n"))) return;
    el.disabled = true;
    const res = await Promise.allSettled(ps.map(p => api("/api/run", {project:p.id, mode:"normal"})));
    const failed = res.map((r, i) => r.status === "rejected" ? `${ps[i].name}: ${r.reason.message}` : null).filter(Boolean);
    await refresh(); viewProjects();
    if (failed.length) toast(`${ps.length - failed.length}/${ps.length} started. Failed: ${failed.join(" | ")}`, true);
    else toast(`${ps.length} pipeline(s) started`);
  },
  async promote(el) {
    const p = proj($("#view").dataset.project), from = Number(el.dataset.from), ref = p.production.ref;
    if (!confirm(`PRODUCTION: start pipeline for ${p.name} on "${ref}"?\n\nStaging pipeline #${from} succeeded.\nMake sure "${ref}" already contains the staging changes (merged in GitLab) — the launcher does not merge.`)) return;
    el.disabled = true;
    try { const r = await api("/api/run", {project:p.id, mode:"promote", from}); await refresh();
      toast(`Production pipeline #${r.id} started`); location.hash = `${pUrl(p)}/pl/${r.id}`; }
    catch (e) { toast(e.message, true); el.disabled = false; }
  },
  async play(el) {
    const p = proj($("#view").dataset.project);
    if (!confirm(`Start manual job "${el.dataset.name}"?`)) return;
    el.disabled = true;
    try { await api("/api/play", {project:p.id, job:Number(el.dataset.job)}); toast(`${el.dataset.name} started`); render(); }
    catch (e) { toast(e.message, true); el.disabled = false; }
  },
  async del() {
    const p = proj($("#view").dataset.project);
    if (!confirm(`Remove ${p.name} from the launcher?`)) return;
    try { await api("/api/projects/delete", {id:p.id}); await refresh(); toast("Project removed"); location.hash = "#/"; }
    catch (e) { toast(e.message, true); }
  },
  async check(el) {
    el.disabled = true;
    try { await api("/api/check-now", {}); await refresh(); viewSettings(); toast("TYPO3 check done"); }
    catch (e) { toast(e.message, true); el.disabled = false; }
  },
  async teamstest(el) {
    el.disabled = true;
    try { await saveTeams(); toast((await api("/api/teams/test", {})).msg); }
    catch (e) { toast(e.message, true); el.disabled = false; }
  },
  async teamsdel() {
    if (!confirm("Remove the stored Teams webhook URL? Teams messages are switched off.")) return;
    try { await saveTeams({enabled:false, url:"", clear_url:true}); toast("Webhook URL removed"); } catch (e) { toast(e.message, true); }
  },
  async mailtest(el) {
    el.disabled = true;
    try { await saveEmail(); toast((await api("/api/email/test", {})).msg); }
    catch (e) { toast(e.message, true); el.disabled = false; }
  },
  async mailpwdel() {
    if (!confirm("Remove the stored SMTP password?")) return;
    try { await saveEmail({password:"", clear_password:true}); toast("SMTP password removed"); } catch (e) { toast(e.message, true); }
  },
  async schedrun(el) {
    el.disabled = true; el.textContent = "Running…";
    try { const r = await api("/api/scheduler/run", {id:el.dataset.id}); await refresh(); viewScheduler(); toast(r.result, !r.ok); }
    catch (e) { toast(e.message, true); el.disabled = false; el.textContent = "▶ Run now"; }
  },
  async t3mrefresh(el) {
    el.disabled = true; el.textContent = "Checking…";
    await loadT3m(proj($("#view").dataset.project), T3M_ENVS.find(e => e.env === el.dataset.env), true);
  },
  async tokentest() { try { toast((await api("/api/token/test", {})).msg); } catch (e) { toast(e.message, true); } },
  async tokendel() {
    if (!confirm("Remove the stored GitLab token?")) return;
    try { await api("/api/token/delete", {}); await refresh(); viewSettings(); toast("Token removed"); } catch (e) { toast(e.message, true); }
  },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el); }
});

window.addEventListener("hashchange", render);
render();
setInterval(async () => {          // refresh list views only; never interrupt forms or pipeline view
  const h = location.hash.slice(1) || "/";
  await refresh();
  if (h === "/" ) viewProjects(); else if (h === "/activity") viewActivity();
  else if (h === "/scheduler" && !viewScheduler.dirty) viewScheduler();
}, 30000);
</script>
</body>
</html>
